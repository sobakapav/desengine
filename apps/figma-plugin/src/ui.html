<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        background: #f8fafc;
        color: #1f2937;
        font-family: Inter, sans-serif;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
      }

      p {
        margin: 0;
        color: #64748b;
        font-size: 12px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        border: 1px solid #0f766e;
        border-radius: 6px;
        background: #0f766e;
        color: white;
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
      }

      button.secondary {
        border-color: #cbd5e1;
        background: white;
        color: #334155;
      }

      button:disabled {
        border-color: #cbd5e1;
        background: #e2e8f0;
        color: #94a3b8;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>desengine</h1>
      <p id="selection">Выберите компонент или variant set в Figma.</p>
      <p id="status">Готов к dev handoff на localhost:37645.</p>
      <div class="actions">
        <button disabled id="create-exploded" type="button">Создать взрыв-схему</button>
        <button id="send" type="button">Отправить выбор</button>
        <button class="secondary" id="close" type="button">Закрыть</button>
      </div>
    </main>
    <script>
      const selection = document.getElementById('selection');
      const status = document.getElementById('status');
      const createExploded = document.getElementById('create-exploded');

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;

        if (message?.type === 'desengine:selection-summary') {
          createExploded.disabled = !message.canCreateExplodedFrame;
          selection.textContent = message.canCreateExplodedFrame
            ? `Auto-layout Frame: ${message.firstNodeName}.`
            : 'Выберите auto-layout Frame в Figma.';
        }

        if (message?.type === 'desengine:send-result') {
          status.textContent = message.message;
        }
      };

      document.getElementById('send').addEventListener('click', () => {
        console.log('[desengine:figma-ui] send button clicked');
        status.textContent = 'Отправка...';
        parent.postMessage({ pluginMessage: { type: 'desengine:send-selection' } }, '*');
      });

      createExploded.addEventListener('click', () => {
        console.log('[desengine:figma-ui] create exploded frame button clicked');
        status.textContent = 'Создаю взрыв-схему...';
        parent.postMessage({ pluginMessage: { type: 'desengine:create-exploded-frame' } }, '*');
      });

      document.getElementById('close').addEventListener('click', () => {
        console.log('[desengine:figma-ui] close button clicked');
        parent.postMessage({ pluginMessage: { type: 'desengine:close' } }, '*');
      });
    </script>
  </body>
</html>
