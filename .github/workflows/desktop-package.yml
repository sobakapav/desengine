name: Desktop Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:desktop

      - name: Archive package on Linux/macOS
        if: runner.os != 'Windows'
        run: tar -czf "desengine-${{ runner.os }}-x64.tar.gz" -C apps/desktop/out .

      - name: Archive package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path apps/desktop/out/* -DestinationPath "desengine-Windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: desengine-${{ runner.os }}-x64
          path: |
            desengine-${{ runner.os }}-x64.tar.gz
            desengine-Windows-x64.zip
          if-no-files-found: error