<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Схема справки desengine</title>
  <desc id="desc">Три блока показывают Markdown, картинки и Mermaid как источники help-контента.</desc>
  <rect width="640" height="320" fill="#f7f5ef"/>
  <rect x="42" y="54" width="160" height="212" rx="8" fill="#ffffff" stroke="#111111" stroke-opacity=".18"/>
  <rect x="240" y="54" width="160" height="212" rx="8" fill="#ffffff" stroke="#111111" stroke-opacity=".18"/>
  <rect x="438" y="54" width="160" height="212" rx="8" fill="#ffffff" stroke="#111111" stroke-opacity=".18"/>
  <text x="122" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">MD</text>
  <text x="320" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">IMG</text>
  <text x="518" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">MMD</text>
  <text x="122" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#555555">help/*.md</text>
  <text x="320" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#555555">help/images/*</text>
  <text x="518" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#555555">help/mermaid/*.mmd</text>
  <path d="M202 160h38M400 160h38" stroke="#111111" stroke-opacity=".35" stroke-width="2"/>
</svg>

